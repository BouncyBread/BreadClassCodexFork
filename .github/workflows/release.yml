name: Package and release

# Tag-driven. The private data repo's refresh.sh pushes updated db_*.lua here and
# creates a tag; that tag is what triggers a packaged release, so the weekly
# scrape and the addon release stay in lockstep.
on:
  push:
    tags:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The packager reads tag history to build the changelog.
          fetch-depth: 0

      - name: Sanity-check the addon before packaging
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lua5.4
          fail=0
          for f in $(find . -name '*.lua' -not -path './Libs/*'); do
            luac5.4 -p "$f" || { echo "SYNTAX FAIL: $f"; fail=1; }
          done
          # Every file the TOC lists must exist, or the addon half-loads in game.
          python3 - <<'PY'
          import os, sys
          toc = "BreadClassCodex.toc"
          missing = []
          for raw in open(toc, encoding="utf8", errors="replace"):
              line = raw.strip()
              if not line or line.startswith("#"):
                  continue
              p = line.replace("\\", "/")
              if not os.path.isfile(p):
                  missing.append(p)
          if missing:
              print("TOC lists files that do not exist:")
              for m in missing:
                  print("  ", m)
              sys.exit(1)
          print("TOC file list OK")
          PY
          exit $fail

      - name: Package and publish
        uses: BigWigsMods/packager@master
        # GitHub releases always. Wago too, but ONLY once both halves exist:
        #   1. a WAGO_API_TOKEN repo secret (Settings > Secrets > Actions), and
        #   2. a `## X-Wago-ID: <id>` line in BreadClassCodex.toc, taken from
        #      https://addons.wago.io/developers beneath the addon's name.
        # With either missing the packager simply skips Wago, so this is inert
        # until both are in place.
        #
        # Wago matters because WowUp's GitHub provider cannot UPDATE an addon:
        # its update path fetches api.github.com/.../releases/assets/{id} without
        # Accept: application/octet-stream, gets JSON instead of the zip, and
        # fails on unzip. Its Wago provider works. See README.
        #
        # CRITICAL: the X-Wago-ID must be this FORK's own project id. Upstream
        # Class Codex is rNkynwKa — using that would make every addon manager
        # treat this as upstream and overwrite it with jfstn's builds, which is
        # exactly why the inherited X-Wago-ID / X-Curse-Project-ID lines were
        # stripped from the TOC in the first place.
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
